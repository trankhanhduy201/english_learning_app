version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: api_dockerfile 
    container_name: django_api
    volumes:
      - ./backend/english_learning_app:/code
      - ./supervisord/default.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./logs/supervisord:/var/log/supervisord
      - uvicorn_socket:/run/uvicorn
      - static_volume:/code/static
      - media_volume:/code/media
    expose:
      - "54082"
    depends_on:
      - redis
    restart: always
    environment:
      DJANGO_SUPERUSER_USERNAME: root
      DJANGO_SUPERUSER_EMAIL: root@example.com
      DJANGO_SUPERUSER_PASSWORD: root

  web:
    build:
      context: .
      dockerfile: web_dockerfile
    container_name: react_app
    volumes:
      - ./frontend/english_flashcard_app:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "54080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
      - uvicorn_socket:/run/uvicorn
      - static_volume:/code/static
      - media_volume:/code/media
    depends_on:
      - api
    restart: always

  react_nginx:
    image: nginx:alpine
    container_name: react_nginx
    ports:
      - "54081:80"
    volumes:
      - ./nginx/react_default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/english_flashcard_app/build:/usr/share/nginx/html
    depends_on:
      - api
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always

volumes:
  uvicorn_socket:
  static_volume:
  media_volume: